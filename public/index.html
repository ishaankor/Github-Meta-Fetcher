<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Meta Fetcher Server</title>
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background-color: #0b0c10;
      color: #66fcf1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      border: 1px solid #1f2833;
      padding: 2.2rem 2.6rem;
      border-radius: 14px;
      background: #1f2833;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 520px;
      width: 100%;
    }
    h1 {
      font-size: 1.55rem;
      margin-top: 0;
      margin-bottom: 1.2rem;
      letter-spacing: -0.02em;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.4; }
    }
    .endpoints {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      background: #0b0c10;
      padding: 1.1rem 1.25rem;
      border-radius: 10px;
      border: 1px solid #2d3748;
      font-size: 0.9rem;
    }
    .endpoint-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .endpoint-label {
      color: #94a3b8;
      font-size: 0.82rem;
    }
    a {
      color: #45a29e;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.15s ease;
    }
    a:hover {
      color: #66fcf1;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Personal Meta Fetcher Vercel Server</h1>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Status: Online &amp; Active</span>
    </div>
    <div class="endpoints">
      <div class="endpoint-row">
        <span class="endpoint-label">GitHub Telemetry</span>
        <a href="/api/github">/api/github ↗</a>
      </div>
      <div class="endpoint-row">
        <span class="endpoint-label">Spotify Telemetry</span>
        <a href="/api/spotify">/api/spotify ↗</a>
      </div>
      <div class="endpoint-row">
        <span class="endpoint-label">Service Matrix</span>
        <a href="/api">/api ↗</a>
      </div>
    </div>
  </div>
</body>
</html>
